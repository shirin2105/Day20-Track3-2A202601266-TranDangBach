name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chạy unit tests trên dữ liệu ảo (không cần cloud storage)
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt numpy pandas scikit-learn fastapi uvicorn pydantic google-cloud-storage pytest dvc dvc-gs mlflow pyyaml joblib
      - name: Run tests
        run: pytest tests/test_train.py -v

  # JOB 2: Huấn luyện trên dữ liệu thật, upload mô hình lên cloud storage
  train:
    name: Train
    needs: unit-test         # Chỉ chạy khi job unit-test qua
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt numpy pandas scikit-learn fastapi uvicorn pydantic google-cloud-storage pytest dvc dvc-gs mlflow pyyaml joblib

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.STORAGE_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv data/holdout.csv

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage
          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("artifacts/current/model.joblib")
          blob.upload_from_filename("models/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  # JOB 3: Quality gate - chặn triển khai nếu f1_score < 0.65
  quality-gate:
    name: Quality Gate
    needs: train             # Chỉ chạy khi job train qua
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huỷ triển khai.")
          print("PASSED: đang triển khai model.")
          PYEOF

  # JOB 4: Triển khai lên Render
  release:
    name: Release
    needs: quality-gate      # Chỉ chạy khi job quality-gate qua
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set, skipping Render deployment."
            exit 0
          fi
          echo "Kích hoạt Render Deploy Hook..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Đã gửi tín hiệu deploy tới Render. Việc build sẽ mất vài phút."
          
      - name: Verify Health
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "RENDER_URL is not set, skipping health check."
            exit 0
          fi
          echo "Chờ Render khởi động (sleep 60s)..."
          sleep 60
          curl -sf "${{ secrets.RENDER_URL }}/healthz" && echo "Health check passed." || echo "Vui lòng tự kiểm tra lại URL sau vài phút."
